<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Covenant Path — an independent tool for stake and ward leaders to track new and prospective members' covenant-path progress. Not an official product of The Church of Jesus Christ of Latter-day Saints.">

  <!-- SEO + social link previews: Open Graph / Twitter Card (N1). Absolute URLs so crawlers
       (Facebook, iMessage, Slack, WhatsApp, Twitter/X) can fetch the preview image. -->
  <link rel="canonical" href="https://app.membercovenantpath.org/">
  <meta name="theme-color" content="#2C3E50">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Covenant Path">
  <meta property="og:title" content="Covenant Path — track members' covenant-path progress">
  <meta property="og:description" content="An independent tool for stake and ward leaders to track new and prospective members' covenant-path progress. Not an official product of The Church of Jesus Christ of Latter-day Saints.">
  <meta property="og:url" content="https://app.membercovenantpath.org/">
  <meta property="og:image" content="https://app.membercovenantpath.org/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Covenant Path logo">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Covenant Path — track members' covenant-path progress">
  <meta name="twitter:description" content="An independent tool for stake and ward leaders to track new and prospective members' covenant-path progress.">
  <meta name="twitter:image" content="https://app.membercovenantpath.org/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Covenant Path">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Covenant Path</title>
  <link rel="manifest" href="manifest.json">

  <!-- Passwordless passkey (WebAuthn) helper — used by lib/passkey_web.dart. -->
  <script src="passkey.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
