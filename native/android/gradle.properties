# JVM args for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Configuration cache is left OFF for the broadest CI compatibility (a clean checkout has no cache
# to reuse anyway; some plugin combos still warn under it). Build caching stays on.
org.gradle.caching=true

# AndroidX + Kotlin
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Supabase config — injected into BuildConfig (see app/build.gradle.kts).
# Leave EMPTY here (never commit a real key). Override at build time with either:
#   ./gradlew assembleDebug -PSUPABASE_URL=https://<ref>.supabase.co -PSUPABASE_ANON_KEY=sb_publishable_...
# or environment variables SUPABASE_URL / SUPABASE_ANON_KEY (CI-friendly),
# or a local, GIT-IGNORED gradle.properties in ~/.gradle/.
# The anon/publishable key is safe on clients — Row-Level Security does the gating.
#
# BROKER_URL points at the Church-login auth broker (backend/auth_broker). Leave EMPTY to hide
# Church-account login, passkeys, reports, sync settings, and the admin console (Email-code login
# and the read-only dashboard still work against Supabase directly).
# ---------------------------------------------------------------------------
SUPABASE_URL=
SUPABASE_ANON_KEY=
BROKER_URL=
