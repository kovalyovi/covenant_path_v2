# JVM args for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# AndroidX + Kotlin
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Supabase config — injected into BuildConfig (see app/build.gradle.kts).
# Leave EMPTY here (never commit a real key). Override at build time with either:
#   ./gradlew assembleDebug -PSUPABASE_URL=https://<ref>.supabase.co -PSUPABASE_ANON_KEY=sb_publishable_...
# or environment variables SUPABASE_URL / SUPABASE_ANON_KEY (CI-friendly),
# or a local, GIT-IGNORED gradle.properties in ~/.gradle/.
# The anon/publishable key is safe on clients — Row-Level Security does the gating.
# ---------------------------------------------------------------------------
SUPABASE_URL=
SUPABASE_ANON_KEY=
