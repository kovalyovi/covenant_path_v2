[versions]
# Toolchain
agp = "8.7.3"
kotlin = "2.1.0"                  # Kotlin 2.x → use the standalone Compose compiler plugin
ksp = "2.1.0-1.0.29"

# AndroidX / Compose
coreKtx = "1.15.0"
lifecycle = "2.8.7"               # lifecycle-viewmodel-compose, runtime-compose (collectAsStateWithLifecycle)
activityCompose = "1.9.3"
composeBom = "2024.12.01"         # Compose BOM → aligns compose-ui / material3 / etc.
navigationCompose = "2.8.5"
coil = "2.7.0"                    # AsyncImage for member photo_url (Compose)
biometric = "1.1.0"              # BiometricPrompt app-lock gate
credentials = "1.3.0"           # Credential Manager — native passkeys (WebAuthn) via the broker
datastore = "1.1.1"             # DataStore Preferences — persist theme/app-lock/stake choice
securityCrypto = "1.1.0-alpha06" # EncryptedSharedPreferences (Keystore-backed) for the auth session
fragment = "1.8.5"              # FragmentActivity host (BiometricPrompt); pin recent so it stays coherent

# Supabase (supabase-kt) + Ktor + serialization
# NOTE: artifact ids changed in 3.x — `gotrue-kt` is now published as `auth-kt`.
# The BOM pins Auth/Postgrest/serialization to one coherent version.
supabase = "3.1.1"
ktor = "3.0.3"                    # supabase-kt 3.1.x targets Ktor 3.x
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"

# Test
material = "1.12.0"              # Material Components — provides the Theme.Material3.* XML splash theme
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
# AndroidX core / lifecycle / activity
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose (versions come from the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Image loading
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Biometric app-lock + passkeys (Credential Manager) + persisted prefs (DataStore)
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Material Components (XML) — only for the launch theme parent (Theme.Material3.DayNight.NoActionBar)
google-android-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Supabase BOM + modules (auth = gotrue, postgrest, serialization)
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }

# Ktor engine for Android (required by supabase-kt at runtime). ktor-client-core is also used
# directly by our broker/admin/passkey clients (manual JSON, mirroring the Flutter http clients).
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }

# kotlinx
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
