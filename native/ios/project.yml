# XcodeGen spec for the Covenant Path native iOS app.
#
# CI runs (in native/ios):
#   brew install xcodegen
#   xcodegen generate
#   xcodebuild -scheme CovenantPath -destination 'generic/platform=iOS' \
#              -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
#
# Architecture: the app target compiles ALL of `Sources/CovenantPathKit/**` (Models / Logic /
# Services / ViewModels / Views) + the `App/` @main shell DIRECTLY, and depends on supabase-swift as
# a remote SPM package. (A separate root-level `Package.swift` exists ONLY so `swift test` can run the
# pure-logic tests as a library on macOS — the xcodeproj does not reference it, which avoids any
# root-local-package resolution quirks under `xcodebuild`.) The SwiftUI views compile FOR iOS
# (they're behind `#if canImport(UIKit)`, true on iOS — so they're INCLUDED here).
name: CovenantPath
options:
  bundleIdPrefix: org.membercovenantpath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Remote supabase-swift (the Supabase + Auth products are linked below).
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.20.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CovenantPath:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # The whole app module compiled directly into the target. Only Swift files (so the plist /
      # xcconfig aren't also added as bundled resources → "multiple commands produce Info.plist").
      - path: Sources/CovenantPathKit
        includes:
          - "**/*.swift"
      - path: App
        includes:
          - "**/*.swift"
      # The asset catalog (AppIcon) — added as a resource so the launcher icon is bundled.
      - path: Sources/CovenantPathKit/Resources/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Covenant Path
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Build-time config, injected from build settings / the xcconfig (empty defaults are fine for CI).
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        BROKER_URL: $(BROKER_URL)
        PASSKEY_RP_ID: $(PASSKEY_RP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.membercovenantpath.viewer
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Empty defaults so an unconfigured CI build still compiles + links.
        SUPABASE_URL: ""
        SUPABASE_ANON_KEY: ""
        BROKER_URL: ""
        PASSKEY_RP_ID: ""
        TARGETED_DEVICE_FAMILY: "1,2"
    # NOTE: we intentionally do NOT wire `configFiles: App/Config.xcconfig` — that file is gitignored
    # and absent in CI, and a missing configFile fails `xcodebuild`. The empty defaults above keep CI
    # green. To inject real values locally, set them in this target's `settings.base`, add the
    # xcconfig via `configFiles`, or pass build settings to `xcodebuild`.
    dependencies:
      - package: supabase-swift
        product: Supabase
      - package: supabase-swift
        product: Auth

# Declare a SHARED scheme named `CovenantPath` so CI's `xcodebuild -scheme CovenantPath` finds it —
# XcodeGen does NOT auto-create schemes, so this is required for the build to resolve a scheme.
schemes:
  CovenantPath:
    build:
      targets:
        CovenantPath: all
    run:
      config: Debug
    archive:
      config: Release
