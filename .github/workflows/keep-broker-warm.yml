name: Keep auth broker warm

# Render's free tier sleeps the auth broker after ~15 min idle; the first request after a
# sleep then fails in the browser (holding page has no CORS header). This pings /health to
# keep it awake. NOTE: GitHub cron is best-effort — measured firing every 2-4 HOURS despite
# the */5 schedule — so this is a BACKSTOP only. The PRIMARY keep-warm is Supabase pg_cron
# (migration 0042: cron.job 'keep-broker-warm', every 4 min via pg_net), which fires on time.
# Override the URL with repo variable BROKER_URL if it ever changes (and update 0042).

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes — free on a public repo; keeps the broker warm with
                             # margin vs Render's ~15-min sleep (best-effort cron can skip a fire),
                             # so a leader's first login isn't a ~60s cold start (#6 login speed).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-broker-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          BASE="${{ vars.BROKER_URL || 'https://covenant-path-broker.onrender.com' }}"
          echo "pinging $BASE/health"
          # Render cold start can take ~60s; allow generous timeouts and one retry.
          curl -fsS --max-time 90 --retry 2 --retry-delay 30 "$BASE/health" && echo "" && echo "ok"
