name: Daily covenant-path sync

# Per-stake isolation (#3): a `prepare` job lists the credentialed stakes, then a `sync` job fans
# out ONE isolated matrix job per stake. Each stake runs in its own job — own logs, own pass/fail,
# and it only ever touches its own data (daily_sync.py --stake <unit>). New stakes appear in the
# matrix automatically as they onboard; nothing per-stake to manage.
#
# No browser needed for login (pure-requests Okta). Chromium is installed only so the rare
# action-id self-heal can run if LCR redeploys.

on:
  schedule:
    # Fire EVERY hour (top of the hour). The prepare step's per-stake schedule (stake_settings
    # .sync_hour_et / sync_paused, migration 0030) decides which stakes actually sync this hour —
    # default 7:00 ET, leader-adjustable in-app. Running hourly + gating in code means DST needs no
    # cron edits. Plus the Thursday 8:20-ET pre-meeting pulse. Off-window hours → empty matrix.
    - cron: "0 * * * *"       # every hour, on the hour (UTC) — ET hour matched in daily_sync.py
    - cron: "20 12,13 * * 4"  # 08:20 ET Thu pre-meeting pulse (EST+EDT candidates)
  workflow_dispatch:
    inputs:
      with_profile:
        description: "Fetch profile fields (baptism/recommend/etc.)"
        type: boolean
        default: true
      targets:
        description: "Where to write"
        type: choice
        options: ["both", "supabase", "sheets"]
        default: "both"
      photos:
        description: "Also refresh member avatars (needs Supabase)"
        type: boolean
        default: false
      stake:
        description: "Sync only this stake (unit number); blank = all enrolled"
        type: string
        default: ""
      unit:
        description: "With 'stake': re-pull only this ONE ward/branch (OPS per-unit refetch)"
        type: string
        default: ""

permissions:
  contents: read

# Don't cancel an in-flight stake when a new run starts; let each finish.
concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  # ---- prepare: which stakes to sync (honors the ET schedule gate) -----------
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      stakes: ${{ steps.list.outputs.stakes }}
    env:
      CP_TOKEN_KEY: ${{ secrets.CP_TOKEN_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install psycopg2-binary cryptography python-dotenv requests
      - id: list
        # GITHUB_EVENT_NAME is provided by the runner; the gate emits [] off the scheduled window.
        # OPS can pass a single stake (unit number) to scope the run; validated numeric to keep it
        # out of the shell, then forwarded as --only.
        env:
          ONLY_STAKE: ${{ inputs.stake }}
        run: |
          ARGS="--list-stakes"
          if [ -n "$ONLY_STAKE" ]; then
            if ! printf '%s' "$ONLY_STAKE" | grep -qE '^[0-9]+$'; then
              echo "stake input must be a numeric unit number"; exit 1
            fi
            ARGS="$ARGS --only $ONLY_STAKE"
          fi
          echo "stakes=$(python scripts/daily_sync.py $ARGS)" >> "$GITHUB_OUTPUT"

  # ---- sync: one isolated job per stake -------------------------------------
  sync:
    needs: prepare
    if: ${{ needs.prepare.outputs.stakes != '[]' && needs.prepare.outputs.stakes != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false   # one stake failing must not cancel the others
      max-parallel: 4
      matrix:
        stake: ${{ fromJson(needs.prepare.outputs.stakes) }}
    env:
      LCR_LOGIN: ${{ secrets.LCR_LOGIN }}
      LCR_PASSWORD: ${{ secrets.LCR_PASSWORD }}
      CP_TOKEN_KEY: ${{ secrets.CP_TOKEN_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Required by the --photos pass (backend/photos.py uses the REST Storage API, keyed by the
      # service-role key) — without it member/missionary avatar uploads never run. Data writes use
      # SUPABASE_DB_URL (psycopg2), so the core sync worked even while this was missing.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SHEETS_SERVICE_ACCOUNT: sheets_sync/service_account.json
      # M7: the sync refreshes a stake's Google Drive OAuth token to (re)create + write its sheet.
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REDIRECT: ${{ secrets.GOOGLE_OAUTH_REDIRECT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium   # only for rare self-heal

      - name: Restore profile cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: tools/output/profile_cache.json
          key: profile-cache-${{ matrix.stake }}-${{ github.run_id }}
          restore-keys: profile-cache-${{ matrix.stake }}-

      - name: Write Google service account (if configured)
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            mkdir -p sheets_sync
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > sheets_sync/service_account.json
            echo "wrote sheets_sync/service_account.json"
          else
            echo "no GOOGLE_SERVICE_ACCOUNT_JSON secret; Sheets push will be skipped"
          fi

      - name: Sync stake ${{ matrix.stake }}
        env:
          TARGETS: ${{ github.event.inputs.targets || 'both' }}
          # Scheduled runs (no dispatch input) refresh avatars by DEFAULT so the 7-day signed URLs stay
          # fresh and the per-sync roster rebuild keeps its photos (carry-forward) — a manual dispatch
          # still controls it explicitly (unchecked = 'false' wins over the default). The pass is
          # best-effort: daily_sync.py swallows any photo error so the data sync never fails over it.
          PHOTOS: ${{ github.event.inputs.photos || 'true' }}
          ONLY_UNIT: ${{ inputs.unit }}
        run: |
          ARGS="--stake ${{ matrix.stake }} --with-profile"
          if [ -n "$ONLY_UNIT" ]; then
            if ! printf '%s' "$ONLY_UNIT" | grep -qE '^[0-9]+$'; then
              echo "unit input must be a numeric unit number"; exit 1
            fi
            ARGS="$ARGS --unit $ONLY_UNIT"
          fi
          # Sheets per-stake (the stake's own spreadsheet) unless dispatch asked supabase-only.
          if [ "$TARGETS" != "supabase" ] && [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            ARGS="$ARGS --sheets"
          fi
          if [ "$TARGETS" != "sheets" ] && [ -n "$SUPABASE_DB_URL" ]; then
            ARGS="$ARGS --supabase"
          fi
          [ "$PHOTOS" = "true" ] && ARGS="$ARGS --photos"
          echo "running: python scripts/daily_sync.py $ARGS"
          python scripts/daily_sync.py $ARGS

      - name: Upload run artifacts (logs + summaries, no PII output)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sync-logs-${{ matrix.stake }}
          path: |
            tools/output/logs/
            tools/output/debug/
            tools/output/health_report.json
            output/covenant_path_access.json
          if-no-files-found: ignore
          retention-days: 14
