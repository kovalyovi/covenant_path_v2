name: Daily covenant-path sync

# Runs the headless pipeline daily: LCR -> report -> Google Sheets (+ Supabase).
# No browser needed for login (pure-requests Okta). Chromium is installed only so the
# rare action-id self-heal can run if LCR redeploys.

on:
  schedule:
    # Times below are ET. Cron is UTC and can't do DST, so we fire the candidate UTC hours
    # for both EST and EDT; daily_sync.py (_should_run_now) runs only at the intended ET
    # time — 7:00 ET daily, plus 8:20 ET Thursdays (before the 8:30 meeting).
    - cron: "0 11,12 * * *"   # 07:00 ET daily  (11:00 UTC during EDT / 12:00 UTC during EST)
    - cron: "20 12,13 * * 4"  # 08:20 ET Thu    (12:20 UTC during EDT / 13:20 UTC during EST)
  workflow_dispatch:          # manual run button (also how the admin console triggers flows)
    inputs:
      with_profile:
        description: "Fetch profile fields (baptism/recommend/etc.)"
        type: boolean
        default: true
      targets:
        description: "Where to write"
        type: choice
        options: ["both", "supabase", "sheets"]
        default: "both"
      photos:
        description: "Also refresh member avatars (needs Supabase)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LCR_LOGIN: ${{ secrets.LCR_LOGIN }}
      LCR_PASSWORD: ${{ secrets.LCR_PASSWORD }}
      CP_TOKEN_KEY: ${{ secrets.CP_TOKEN_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SHEETS_SERVICE_ACCOUNT: sheets_sync/service_account.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium   # only for rare self-heal

      # Restore the incremental profile cache across runs (best-effort; Supabase
      # members.updated_at is the durable incremental mechanism — see ADR-002).
      - name: Restore profile cache
        uses: actions/cache@v4
        with:
          path: tools/output/profile_cache.json
          key: profile-cache-${{ github.run_id }}
          restore-keys: profile-cache-

      - name: Write Google service account (if configured)
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            mkdir -p sheets_sync
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > sheets_sync/service_account.json
            echo "wrote sheets_sync/service_account.json"
          else
            echo "no GOOGLE_SERVICE_ACCOUNT_JSON secret; Sheets push will be skipped"
          fi

      - name: Run daily sync
        env:
          TARGETS: ${{ github.event.inputs.targets || 'both' }}
          PHOTOS: ${{ github.event.inputs.photos || 'false' }}
        run: |
          ARGS="--with-profile"
          # Sheets unless the dispatch asked for supabase-only (and only if configured).
          if [ "$TARGETS" != "supabase" ] && [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            ARGS="$ARGS --sheets"
          fi
          # Supabase unless the dispatch asked for sheets-only (and only if configured).
          if [ "$TARGETS" != "sheets" ] && [ -n "$SUPABASE_DB_URL" ]; then
            ARGS="$ARGS --supabase"
          fi
          [ "$PHOTOS" = "true" ] && ARGS="$ARGS --photos"
          [ -n "$SPREADSHEET_ID" ] && ARGS="$ARGS --spreadsheet-id $SPREADSHEET_ID"
          echo "running: python scripts/daily_sync.py $ARGS"
          python scripts/daily_sync.py $ARGS

      - name: Upload run artifacts (logs + summaries, no PII output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: |
            tools/output/logs/
            tools/output/health_report.json
            output/covenant_path_access.json
          if-no-files-found: ignore
          retention-days: 14
