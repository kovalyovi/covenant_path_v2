name: Build native iOS (PoC)

# Compiles the native SwiftUI app on a macOS runner (has Xcode) — proves the iOS PoC builds.
# XcodeGen turns native/ios/project.yml into an .xcodeproj, then xcodebuild builds it UNSIGNED
# for the generic iOS device (no provisioning needed). Manual + on changes to native/ios.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/ios/**'
      - '.github/workflows/build-native-ios.yml'

permissions:
  contents: write   # publish the .ipa as a rolling Release asset (direct download, no artifact zip)

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Select newest Xcode (iOS 26 SDK → real Liquid Glass; falls back gracefully)
        # The app compiles real Liquid Glass only under the Xcode 26 toolchain (Swift 6.2); older
        # Xcodes compile the frosted-material fallback (see Views/Shared/Glass.swift), so this never
        # breaks the build — it just upgrades to genuine glass when a 26.x is on the runner. Picks the
        # highest-versioned /Applications/Xcode_*.app, else the default symlink.
        run: |
          set -e
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ] && [ -d "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST"
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: native/ios
        run: xcodegen generate
      - name: Build (unsigned, generic iOS device)
        working-directory: native/ios
        # Inject real config (anon key is RLS-safe; broker enables Church login) via build settings
        # → Info.plist, so the sideloaded .ipa is a WORKING build, not the config-error screen.
        # Empty values still build a valid app. Mirrors the Android workflow.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BROKER_URL: ${{ secrets.BROKER_URL }}
        run: |
          set -o pipefail
          # -configuration Release: a Debug build produces a thin stub binary + a separate
          # *.debug.dylib, which (a) trips AltStore's resign/parse ("data couldn't be read… not in the
          # correct format" / ServerError 2005) and (b) is unoptimized → slow on heavy screens. Release
          # is a single optimized self-contained binary — sideload-friendly and fast.
          xcodebuild \
            -scheme CovenantPath \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            SUPABASE_URL="$SUPABASE_URL" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" BROKER_URL="$BROKER_URL" \
            build
      - name: Package unsigned .ipa (for AltStore/Sideloadly — see docs/IOS_SIDELOAD.md)
        working-directory: native/ios
        # An unsigned .ipa is just the built .app inside a Payload/ folder, zipped. AltStore /
        # SideStore / Sideloadly re-sign it with a free Apple ID at install time (7-day refresh).
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 3 -name 'CovenantPath.app' -type d | head -1)
          test -n "$APP" || { echo "::error::CovenantPath.app not found"; exit 1; }
          echo "Packaging $APP"
          rm -rf Payload CovenantPath.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CovenantPath.ipa Payload
          ls -lh CovenantPath.ipa
      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: covenant-path-ios-unsigned-ipa
          path: native/ios/CovenantPath.ipa
          if-no-files-found: error
      - name: Publish .ipa to a rolling Release (DIRECT .ipa download — no artifact double-zip)
        # The GitHub *artifact* download wraps CovenantPath.ipa in a .zip; handing that .zip to
        # AltStore/Sideloadly fails with "data couldn't be read… not in the right format". A Release
        # ASSET downloads as the raw .ipa, so it installs directly. Rolling tag `ios-latest`, asset
        # re-uploaded (--clobber) every main build. See docs/IOS_SIDELOAD.md.
        if: github.ref == 'refs/heads/main'
        working-directory: native/ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest \
            --title "iOS app — latest main build (unsigned)" \
            --notes "Unsigned .ipa for AltStore / SideStore / Sideloadly. **Download \`CovenantPath.ipa\` directly below** (do NOT use the Actions artifact zip). Rebuilt on every push to main." \
            --prerelease
          gh release upload ios-latest CovenantPath.ipa --clobber
      - name: Unit tests (pure logic, macOS)
        working-directory: native/ios
        continue-on-error: true   # logic tests are macOS-buildable; UI target is iOS-only
        run: swift test || true
