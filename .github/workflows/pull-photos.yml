name: Pull member photos (Member Tools bundle)

# On-demand member-photo pull for local tooling (e.g. putting faces next to
# names in stake planning docs). Triggered manually:
#   gh workflow run pull-photos.yml
# then download the artifact:
#   gh run download <run-id> -n stake-photos -D <dir>
#
# Auth: LCR_LOGIN / LCR_PASSWORD repo secrets (the script mints a Member Tools
# token off a headless Okta login; no MFA prompt for accounts without 2SV).
# Photos are facial PII: the artifact stays in this private repo's Actions
# storage (30-day retention) and is never committed.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pull-photos
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LCR_LOGIN: ${{ secrets.LCR_LOGIN }}
      LCR_PASSWORD: ${{ secrets.LCR_PASSWORD }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pull dependencies
        run: pip install requests python-dotenv Pillow

      - name: Pull member photos
        run: python scripts/pull_photos.py

      - name: Upload photos artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stake-photos
          path: tools/output/photos
          if-no-files-found: error
          retention-days: 30
