name: Build Android APK

# Builds a sideloadable release APK (debug-signed) for the viewer and uploads it as an artifact.
# Manual (workflow_dispatch) + on changes to the app or this workflow. The release APK is signed
# with the debug key (no secrets) so it installs on any device for testing; a Play Store build
# would add a real keystore (see apps/viewer/android/app/build.gradle.kts).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/viewer/lib/**'
      - 'apps/viewer/pubspec.yaml'
      - 'apps/viewer/android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: apps/viewer
        run: flutter pub get
      - name: Build release APK
        working-directory: apps/viewer
        # Anon key is RLS-safe (not a secret); BROKER_URL enables Church login. Supplied as repo
        # variables/secrets so the artifact is a real, working build. Empty values still build a
        # valid APK (the app shows the config-error screen until pointed at a backend).
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=BROKER_URL="${{ vars.BROKER_URL }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: covenant-path-release-apk
          path: apps/viewer/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
