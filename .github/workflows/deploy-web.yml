name: Deploy web app to Cloudflare Pages

# WEB = React (apps/web) as of the #4 cutover. The Flutter app (apps/viewer) still powers
# iOS / macOS / Android (built by the build-native-* workflows); only the WEB build moved to React.
# ROLLBACK to Flutter web: restore this file from the commit before the cutover (it built
# apps/viewer with flutter-action and deployed apps/viewer/build/web).

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build React web (apps/web)
        working-directory: apps/web
        env:
          # Vite bakes these in at build time. The anon key is client-safe (RLS gates access).
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_BROKER_URL: ${{ secrets.BROKER_URL }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          npm ci
          npm run build

      # cloudflare/pages-action@v1 is deprecated (Node 20 runtime, removed Sep 2026) — Cloudflare's
      # recommended replacement is calling wrangler directly. `--branch=main` marks it a production
      # deployment. (Trade-off vs the old action: no GitHub deployment status on the commit.)
      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name=covenant-path-app --branch=main

      # E2E smoke: wait for the deploy to propagate, then verify the LIVE site serves the shell
      # uncached and every lazy route chunk (KpisTab/AdminPage/AdminListPage) with 200 + immutable —
      # catches the "Failed to fetch dynamically imported module" class of breakage before users do.
      - name: Smoke-test live site
        working-directory: apps/web
        env:
          APP_URL: ${{ secrets.APP_URL }} # falls back to production URL when unset
        run: npm run smoke
