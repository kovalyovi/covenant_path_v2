name: Deploy web app to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/viewer/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # required for Cloudflare Pages deployment status
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build Flutter web
        working-directory: apps/viewer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BROKER_URL: ${{ secrets.BROKER_URL }}
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build web --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=BROKER_URL=$BROKER_URL

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: covenant-path-app   # must match the project name in Cloudflare Pages
          directory: apps/viewer/build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }} # posts deploy status on the commit
