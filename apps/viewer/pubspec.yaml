name: covenant_path_viewer
description: Covenant-path viewer — reads the backend, scoped to your calling (web/iOS/macOS/Android).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.6.0
  intl: ^0.19.0
  http: ^1.2.0          # calls the Church-login auth broker (backend/auth_broker)
  fl_chart: ^0.69.0     # KPI line charts (iOS-app-style graphs)
  url_launcher: ^6.3.2
  local_auth: ^3.0.1          # native biometric app-lock (Face ID / fingerprint / Hello)
  web: ^1.1.0                 # WebAuthn platform-authenticator lock on web (biometric_web.dart)
  shared_preferences: ^2.5.5
  sentry_flutter: ^8.14.2

# app_links 7.1.0 (transitive via supabase_flutter) ships an android/build.gradle.kts that throws
# "DefaultAndroidSourceSet_Decorated cannot be cast to AndroidLibrarySourceSet" with our AGP — pin
# the 6.x line (plain Groovy build.gradle, no typed-sourceSets cast). Within supabase_flutter's
# allowed range (>=6.2.0 <8.0.0). Revisit when app_links fixes its build script for our AGP.
dependency_overrides:
  app_links: 6.4.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true