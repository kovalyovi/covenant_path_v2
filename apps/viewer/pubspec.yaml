name: covenant_path_viewer
description: Covenant-path viewer — reads the backend, scoped to your calling (web/iOS/macOS/Android).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.6.0
  intl: ^0.19.0
  http: ^1.2.0          # calls the Church-login auth broker (backend/auth_broker)
  fl_chart: ^0.69.0     # KPI line charts (iOS-app-style graphs)
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
